<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link rel="icon" type="image/jpeg" href="assets/images/me.jpg" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <div class="container border-4">
      <nav class="navbar">
        <!-- nav bar  -->
      </nav>
    </div>

    <main class="main">
      <section class="contact" id="contact">
        <div class="container">
          <h1 class="container primary-heading primary-heading__other">
            Contact Me
          </h1>

          <p class="projects__intro fade-in">
            Have a project in mind or just want to say hi? Fill out the
            form below, or reach me directly through
            <span class="highlight">email or any of the channels</span>
            beside it.
          </p>

          <div class="contact__grid">
            <div class="contact__info fade-in-left">
              <!-- <a
                href="mailto:aidarous1143@gmail.com"
                class="contact__info__item"
              >
                <i class="fas fa-envelope"></i>
                <div>
                  <p class="contact__info__label">Email</p>
                  <p class="contact__info__value">aidarous1143@gmail.com</p>
                </div>
              </a> -->

              <!-- <a href="tel:+252636717613" class="contact__info__item">
                <i class="fas fa-phone"></i>
                <div>
                  <p class="contact__info__label">Phone</p>
                  <p class="contact__info__value">+252 63 6717613</p>
                </div>
              </a> -->

              <div class="contact__info__item">
                <i class="fas fa-location-dot"></i>
                <div>
                  <p class="contact__info__label">Location</p>
                  <p class="contact__info__value">Hargeisa, Somaliland</p>
                </div>
              </div>

              <div class="contact__socials">
                <a
                  href="https://www.facebook.com/suldaan.cidwalba?mibextid=ZbWKwL"
                  target="_blank"
                  rel="noopener"
                  aria-label="Facebook"
                  ><i class="fab fa-facebook-f"></i
                ></a>
                <a
                  href="https://x.com/Caytomaxmed"
                  target="_blank"
                  rel="noopener"
                  aria-label="Twitter / X"
                  ><i class="fab fa-twitter"></i
                ></a>
                <a
                  href="https://www.linkedin.com/in/aidarous-mohomed-b63827204"
                  target="_blank"
                  rel="noopener"
                  aria-label="LinkedIn"
                  ><i class="fab fa-linkedin-in"></i
                ></a>
                <a
                  href="https://github.com/Caytomahamed"
                  target="_blank"
                  rel="noopener"
                  aria-label="GitHub"
                  ><i class="fab fa-github"></i
                ></a>
              </div>
            </div>

            <form class="contact__form fade-in-right" id="contactForm" novalidate>
              <div class="contact__form__row">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required />
              </div>
              <div class="contact__form__row">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required />
              </div>
              <div class="contact__form__row">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required />
              </div>
              <div class="contact__form__row">
                <label for="message">Message</label>
                <textarea
                  id="message"
                  name="message"
                  rows="5"
                  required
                ></textarea>
              </div>
              <button type="submit" class="btn">
                <i class="fas fa-paper-plane"></i> Send Message
              </button>
              <p class="contact__form__note" id="contactFormNote"></p>
            </form>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <!-- footer  -->
    </footer>

    <script type="module" src="js/index.js"></script>
  </body>
</html>
